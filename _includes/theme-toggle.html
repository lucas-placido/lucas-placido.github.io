{%- comment -%} Botão de alternância de tema claro/escuro {%- endcomment -%}
<button id="theme-toggle" type="button" aria-label="Alternar tema claro ou escuro"
  class="inline-flex items-center justify-center w-9 h-9 rounded-lg border text-[var(--muted)] hover:text-[var(--accent)] transition focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--accent)]"
  style="border-color: var(--border)">
  <svg data-icon="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg data-icon="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" style="display:none">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
  </svg>
</button>
<script>
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var moon = btn.querySelector('[data-icon="moon"]');
    var sun = btn.querySelector('[data-icon="sun"]');
    function render(t) {
      // mostra lua no tema claro (clique => escuro), sol no tema escuro (clique => claro)
      var dark = t === 'dark';
      moon.style.display = dark ? 'none' : 'block';
      sun.style.display = dark ? 'block' : 'none';
    }
    render(document.documentElement.getAttribute('data-theme') || 'light');
    btn.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      render(next);
    });
  })();
</script>
