<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="AWS Lakehouse com Apache Iceberg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#115e59"/>
      <stop offset="1" stop-color="#082226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dots)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <g>
    <rect x="860" y="150" width="262" height="56" rx="12" fill="#b45309" opacity="0.22"/>
    <rect x="890" y="222" width="232" height="56" rx="12" fill="#ffffff" opacity="0.10"/>
    <rect x="920" y="294" width="202" height="56" rx="12" fill="#ffffff" opacity="0.12"/>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="82" y="160" font-size="27" font-weight="600" letter-spacing="3" fill="#99f6e4">AWS · MEDALLION</text>
    <text x="80" y="248" font-size="74" font-weight="800" fill="#ffffff">AWS Lakehouse</text>
    <text x="82" y="300" font-size="30" font-weight="500" fill="#cbfbf1">Apache Iceberg · Bronze / Silver / Gold</text>

    <g font-size="26" font-weight="600" fill="#ffffff">
      <g transform="translate(80,372)"><rect width="86" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">AWS</text></g>
      <g transform="translate(180,372)"><rect width="132" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">Iceberg</text></g>
      <g transform="translate(326,372)"><rect width="96" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">Glue</text></g>
      <g transform="translate(436,372)"><rect width="222" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">Step Functions</text></g>
    </g>
