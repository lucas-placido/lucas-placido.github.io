<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="Buscador de Vagas — pipeline ELT + RAG">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b1f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#dots)"/>
  <rect width="1200" height="480" fill="url(#glow)"/>

  <!-- motivo: camadas -->
  <g>
    <rect x="860" y="150" width="262" height="56" rx="12" fill="#ffffff" opacity="0.08"/>
    <rect x="890" y="222" width="232" height="56" rx="12" fill="#ffffff" opacity="0.10"/>
    <rect x="920" y="294" width="202" height="56" rx="12" fill="#ffffff" opacity="0.12"/>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="82" y="160" font-size="27" font-weight="600" letter-spacing="3" fill="#99f6e4">PIPELINE ELT + RAG</text>
    <text x="80" y="252" font-size="74" font-weight="800" fill="#ffffff">Buscador de Vagas</text>

    <!-- chips -->
    <g font-size="26" font-weight="600" fill="#ffffff">
      <g transform="translate(80,366)"><rect width="78" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">dbt</text></g>
      <g transform="translate(172,366)"><rect width="150" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">BigQuery</text></g>
      <g transform="translate(336,366)"><rect width="136" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">Airflow</text></g>
      <g transform="translate(486,366)"><rect width="82" height="48" rx="24" fill="#ffffff" opacity="0.14"/><text x="20" y="31">RAG</text></g>
    </g>
  </g>
</svg>
